<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x2=".3" y2="1"><stop stop-color="#354f5f"/><stop offset=".5" stop-color="#536d79"/><stop offset="1" stop-color="#7d949a"/></linearGradient>
    <pattern id="type" width="14" height="18" patternUnits="userSpaceOnUse"><text y="7" fill="#e5d2a6" font-family="monospace" font-size="8">o :</text><text y="16" fill="#d4ba8d" font-family="monospace" font-size="8">+ O</text></pattern>
    <filter id="cloud" x="-30%" y="-40%" width="160%" height="180%"><feTurbulence type="fractalNoise" baseFrequency=".008 .012" numOctaves="3" seed="14" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="130"/><feGaussianBlur stdDeviation="12"/></filter>
    <mask id="banks"><g fill="white" filter="url(#cloud)"><ellipse cx="10" cy="150" rx="320" ry="260"/><ellipse cx="310" cy="50" rx="290" ry="220"/><ellipse cx="180" cy="380" rx="260" ry="150"/><ellipse cx="600" cy="30" rx="150" ry="120"/><ellipse cx="1560" cy="100" rx="270" ry="200"/><ellipse cx="1570" cy="330" rx="280" ry="160"/><ellipse cx="1330" cy="420" rx="180" ry="80"/><ellipse cx="850" cy="920" rx="500" ry="40"/><ellipse cx="50" cy="900" rx="300" ry="35"/></g></mask>
  </defs>
  <path fill="url(#sky)" d="M0 0h1600v1000H0z"/>
  <g mask="url(#banks)"><path fill="#d7bc8f" opacity=".13" d="M0 0h1600v1000H0z"/><path fill="url(#type)" opacity=".8" d="M0 0h1600v1000H0z"/></g>
</svg>
